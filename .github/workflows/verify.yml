name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify MacSoul
        run: ./scripts/verify.sh
      - name: Print verification logs on failure
        if: failure()
        shell: bash
        run: |
          for file in \
            .artifacts/doctor.log \
            .artifacts/build.log \
            .artifacts/test.log \
            .artifacts/progress-verify.log
          do
            if [[ -f "$file" ]]; then
              echo "::group::$file"
              tail -n 400 "$file"
              echo "::endgroup::"
            fi
          done
