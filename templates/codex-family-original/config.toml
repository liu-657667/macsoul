# MacSoul project-local Codex defaults — GPT-6 family edition (2026-09-23).
# Default to Sol for sustained implementation work; route hard reasoning to Astra
# and focused/high-volume work to Luna via explicit subagents.
model = "gpt-6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[agents.architect]
description = "Read-only GPT-6 Astra architecture and hard-problem advisor. Use for ambiguous design decisions, difficult blockers, and recovery planning."
config_file = "./agents/architect.toml"

[agents.explorer]
description = "Read-only GPT-6 Luna codebase explorer. Maps relevant files, APIs, tests, and execution paths before implementation."
config_file = "./agents/explorer.toml"

[agents.tester]
description = "GPT-6 Sol verification worker. Adds targeted tests and reproducible validation without broad refactors."
config_file = "./agents/tester.toml"

[agents.reviewer]
description = "Read-only GPT-6 Astra release reviewer for correctness, privacy, performance, concurrency, architecture, and missing tests."
config_file = "./agents/reviewer.toml"

[agents.reporter]
description = "GPT-6 Luna sprint reporter. Updates STATUS and daily reports from verified repository evidence only."
config_file = "./agents/reporter.toml"
